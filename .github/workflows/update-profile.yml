name: Refresh profile data

on:
  schedule:
    # GitHub schedules are UTC. A non-zero minute helps avoid peak-hour congestion.
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [profile-update]

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh projects and recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: dev-aryank
        run: node .github/scripts/update-readme.mjs

      - name: Commit changes when needed
        run: |
          if git diff --quiet README.md; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile activity"
          git push

