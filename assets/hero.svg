<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aryankumar Panchasara</title>
  <desc id="desc">Animated developer profile banner for a backend, systems, and computer vision engineer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B16"/>
      <stop offset="0.48" stop-color="#11102B"/>
      <stop offset="1" stop-color="#071A20"/>
    </linearGradient>
    <linearGradient id="border" x1="100" y1="20" x2="1100" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#00D9FF;#22C55E;#8B5CF6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.5" stop-color="#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#22C55E;#8B5CF6;#00D9FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#22C55E">
        <animate attributeName="stop-color" values="#22C55E;#8B5CF6;#00D9FF;#22C55E" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop stop-color="#00D9FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#A78BFA" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typingClip"><rect x="150" y="233" width="0" height="35"><animate attributeName="width" values="0;0;900;900;0" keyTimes="0;0.08;0.48;0.88;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#background)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <circle cx="160" cy="100" r="210" fill="url(#violetGlow)" filter="url(#blur)">
    <animate attributeName="cx" values="150;280;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;150;90" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="300" r="240" fill="url(#cyanGlow)" filter="url(#blur)">
    <animate attributeName="cx" values="1050;900;1050" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;220;300" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.8">
    <circle cx="94" cy="76" r="3" fill="#00D9FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="94" r="3" fill="#A78BFA"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="306" r="2.5" fill="#22C55E"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="305" r="2" fill="#A78BFA"><animate attributeName="opacity" values="1;0.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="98" fill="#94A3B8" font-size="19" font-weight="600" letter-spacing="5">HELLO, I BUILD THINGS THAT THINK IN SYSTEMS</text>
    <text x="600" y="172" fill="#F8FAFC" font-size="54" font-weight="800" letter-spacing="-1.5" filter="url(#textGlow)">Aryankumar Panchasara</text>
    <rect x="270" y="197" width="660" height="2" rx="1" fill="url(#border)" opacity="0.9"/>
    <g clip-path="url(#typingClip)" text-anchor="start">
      <text x="150" y="258" fill="#00D9FF" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="600">$ building reliable backends, fast systems &amp; clearer pixels_</text>
    </g>
    <text x="600" y="314" fill="#CBD5E1" font-size="20" font-weight="500">Java / Spring Boot  •  C++17  •  Python / OpenCV</text>
  </g>

  <rect x="2" y="2" width="1196" height="376" rx="26" stroke="url(#border)" stroke-width="3" stroke-opacity="0.9"/>
</svg>

